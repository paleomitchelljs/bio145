<script>
const C = (q, a) => ({ q, a });
/* the lac operon in any condition: lactose, glucose, and three mutants (no repressor made; an operator the repressor
   cannot grip; a CAP site CAP cannot bind). Off = repressor on the operator; high = repressor off and CAP-cAMP helping. */
function lac(c) {
  const blocked = !c.noRep && !c.lactose && !c.opMut, cap = !c.glucose && !c.capMut;
  return { blocked, cap, tx: blocked ? 0.02 : cap ? 1 : 0.2, word: blocked ? "Off" : cap ? "High: the cells turn blue" : "Low: a trickle" };
}
function lacDraw(c, reveal) {
  return (ctx, w, h) => {
    const l = lac(c); ctx.font = "12px sans-serif";
    ctx.fillStyle = "#1d1d1b"; ctx.fillText("lactose: " + (c.lactose ? "present" : "absent") + "   ·   glucose: " + (c.glucose ? "present" : "absent"), 10, 18);
    const muts = [c.noRep && "no repressor made (lacI broken)", c.opMut && "operator mutated", c.capMut && "CAP site mutated"].filter(Boolean);
    if (muts.length) { ctx.fillStyle = "#a8331a"; ctx.fillText("mutant: " + muts.join(", "), 10, 36); }
    [["CAP site", 10, 60, "#8e6bb0"], ["promoter", 72, 66, "#2f6b8f"], ["operator", 140, 66, "#b5651d"], ["lacZ", 208, 80, "#4a7a2a"], ["lacY", 290, 80, "#4a7a2a"], ["lacA", 372, 80, "#4a7a2a"]].forEach(([n, x, ww, col]) => {
      ctx.fillStyle = col; ctx.fillRect(x, 96, ww, 24); ctx.fillStyle = "#1d1d1b"; ctx.fillText(n, x + 4, 136); });
    if (!reveal) { ctx.fillStyle = "#6b6b68"; ctx.fillText("transcription: ?", 10, 165); return; }
    if (l.blocked) { ctx.fillStyle = "#a8331a"; ctx.beginPath(); ctx.arc(173, 80, 16, 0, 7); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillText("R", 169, 84); }
    if (l.cap && !l.blocked) { ctx.fillStyle = "#8e6bb0"; ctx.beginPath(); ctx.arc(40, 80, 14, 0, 7); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillText("CAP", 30, 84); }
    ctx.fillStyle = "#1d1d1b"; ctx.fillText("transcription", 10, 165); ctx.fillStyle = "#e2e0d9"; ctx.fillRect(100, 155, 200, 12); ctx.fillStyle = "#4a7a2a"; ctx.fillRect(100, 155, 200 * l.tx, 12);
    if (l.tx > 0.9) { ctx.fillStyle = "#2f6b8f"; ctx.beginPath(); ctx.arc(320, 161, 8, 0, 7); ctx.fill(); }
  };
}
const LACQ = [
  [{ lactose: false, glucose: true }, "No lactose to eat."],
  [{ lactose: false, glucose: false }, "No lactose, and no glucose either: cAMP is high."],
  [{ lactose: true, glucose: true }, "Lactose is here, but so is glucose."],
  [{ lactose: true, glucose: false }, "Lactose and no glucose."],
  [{ lactose: false, glucose: false, noRep: true }, "A mutant that makes no repressor. No lactose, no glucose."],
  [{ lactose: false, glucose: true, opMut: true }, "A mutant operator the repressor can't grip. No lactose; glucose present."],
  [{ lactose: true, glucose: false, capMut: true }, "A mutant CAP site. Lactose and no glucose."]
].map(([c, txt]) => { const l = lac(c); return { q: txt + " Predict transcription of the lac genes.", ok: l.word, no: ["Off", "Low: a trickle", "High: the cells turn blue"].filter(x => x !== l.word), draw: lacDraw(c, false), after: lacDraw(c, true), w: 460, h: 180,
  why: l.blocked ? "The repressor sits on the operator." : l.cap ? "Nothing blocks, and CAP-cAMP helps polymerase on." : "Nothing blocks, but without CAP-cAMP polymerase binds poorly." }; });
Kit.run({ id: "b145_lesson33", num: 33, version: 2, stages: [
  { type: "pick", title: "Predict the lac operon", tip: "lacZ, lacY and lacA are transcribed together from one promoter. The repressor grips the operator unless lactose (as allolactose) binds it and pulls it off. CAP, with cAMP, helps RNA polymerase onto the promoter; cAMP is high when glucose is low.",
    voice: ["Two inputs, one output: two-input logic. The repressor is a roadblock; lactose pulls it off.", "A reporter gene (lacZ) turns cells blue."],
    solved: "On only when lactose is present; high only when glucose is also absent. Break the repressor or the operator and it ignores lactose; break the CAP site and it ignores glucose.",
    qs: LACQ },
  { type: "sort", title: "Histone marks", tip: "Acetylation always opens chromatin. Methylation depends on which lysine.",
    voice: ["Histone octamer, tails with lysines. H3K4me3 opens; H3K9me3 closes."],
    bins: ["Opens chromatin (gene on)", "Closes chromatin (gene off)"],
    items: [["Acetylation of a histone lysine", 0], ["H3K4me3", 0], ["H3K9me3", 1], ["A repressive methyl mark", 1], ["Histone acetyltransferase active at a promoter", 0], ["Heterochromatin", 1]] },
  { type: "sort", title: "Operons and gene control (book, chapter 16)", tip: "The lac operon is inducible; the trp operon is repressible.",
    voice: ["Prokaryotes control genes at the operon; eukaryotes have more knobs: chromatin, transcription, processing, stability, translation."],
    bins: ["Lac operon (inducible)", "Trp operon (repressible)", "Eukaryote-only controls"],
    items: [["Normally off; lactose turns it on", 0], ["Normally on; the amino acid tryptophan turns it off", 1], ["Repressor works only when bound to the end product", 1], ["Repressor is released when the inducer binds", 0], ["Enhancers far from the promoter", 2], ["Histone modification", 2], ["Alternative splicing", 2], ["mRNA half-life set by the 3′ UTR", 2]] },
  { type: "sort", title: "Where is gene expression controlled?", tip: "Multiple knobs, the same output.",
    voice: ["Chromatin state, transcription rate, mRNA processing, mRNA stability, translation rate."],
    bins: ["Chromatin state", "Transcription", "mRNA processing", "mRNA stability", "Translation"],
    items: [["Histone acetylation", 0], ["Enhancers and the TATA box", 1], ["Transcription factors binding the promoter", 1], ["Alternative splicing", 2], ["Capping and polyadenylation", 2], ["miRNA degrades the message", 3], ["3′ UTR sets the half-life", 3], ["Ribosome loading and tRNA supply", 4]] },
  { type: "pick", title: "Introns, transposons, selfish RNA", tip: "Introns descend from self-splicing elements.",
    voice: ["Nested dolls of replicators: organism, cell, genome, gene, transcript. Cancer is a cell-level escape. Introns are not for the host."],
    qs: [
      { q: "Introns are thought to descend from…", ok: "Self-splicing group II elements that inserted into genes", no: ["Viruses of bacteria", "Mitochondrial DNA", "tRNA genes"], why: "A good outcome of an insertion." },
      { q: "How is an intron removed?", ok: "Lariat splicing by the spliceosome", no: ["Reverse transcription", "Methylation", "Translation"], why: "Alternative splicing makes several proteins from one gene." },
      { q: "A transposon inserting into a gene most often…", ok: "Does little (neutral), sometimes harms", no: ["Always benefits", "Always kills", "Always silences"], why: "LINEs are neutral; occasionally an insert becomes useful." },
      { q: "The lac repressor is released from the operator when…", ok: "Lactose (allolactose) binds it", no: ["Glucose binds it", "RNA polymerase pushes it", "The operon is deleted"], why: "Inducer binding changes its shape." },
      { q: "The CAP site boosts transcription when…", ok: "Glucose is low, so cAMP is high", no: ["Glucose is high", "Lactose is absent", "The repressor is bound"], why: "Two inputs: lactose and glucose." }] },
  { type: "drill", title: "Cards", voice: ["Type each term. Two right in a row masters a card."],
    bank: ["operon", "promoter", "operator", "repressor", "inducer", "CAP", "cAMP", "lacZ", "enhancer", "TATA box", "acetylation", "methylation", "histone", "intron", "exon", "spliceosome", "transposon", "alternative splicing", "Xist"],
    cards: [
      C("A cluster of genes transcribed together with one promoter.", ["operon", "an operon"]), C("The DNA site where RNA polymerase begins.", ["promoter"]), C("The DNA site where a repressor binds.", ["operator"]),
      C("The protein that blocks transcription.", ["repressor", "a repressor"]), C("A molecule that turns an operon on by binding the repressor.", ["inducer", "an inducer", "lactose", "allolactose"]),
      C("The protein that activates the lac operon when glucose is low.", ["cap", "cap protein", "catabolite activator protein"]), C("The small molecule that rises when glucose is low.", ["camp"]),
      C("The lac gene that encodes β-galactosidase and turns reporter cells blue.", ["lacz"]),
      C("A DNA element that boosts transcription from far away.", ["enhancer", "enhancers"]), C("The promoter element near −25 in eukaryotes.", ["tata box", "tata"]),
      C("Adding acetyl groups to histones makes chromatin…", ["open", "more open"]), C("Methylation of H3K9 makes chromatin…", ["closed", "condensed"]),
      C("The proteins DNA wraps around.", ["histones", "histone"]),
      C("A segment removed from the RNA.", ["intron", "introns"]), C("A segment kept in the mature RNA.", ["exon", "exons"]),
      C("The machine that removes introns.", ["spliceosome"]),
      C("A mobile DNA element.", ["transposon", "transposons", "a transposon"]),
      C("Joining exons in different combinations makes proteins by…", ["alternative splicing"]),
      C("The long non-coding RNA that inactivates an X chromosome.", ["xist"])] }
] });

</script>
