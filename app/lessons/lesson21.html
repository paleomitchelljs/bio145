<body>
<header><h1>Lesson 21</h1></header>
<div id="score-name" style="max-width:1300px; margin:16px auto 0; padding:0 24px;"></div>

<script>
const C = (q, a) => ({ q, a });
const chromo = (n, dup) => (ctx, w, h) => { ctx.strokeStyle = "#1d1d1b"; ctx.lineWidth = 3; for (let i = 0; i < n; i++) { const x = w / 2 - (n - 1) * 30 + i * 60; const arm = (dx) => { ctx.beginPath(); ctx.moveTo(x + dx, 22); ctx.lineTo(x + dx, 118); ctx.stroke(); }; if (dup) { arm(-5); arm(5); ctx.fillStyle = "#b5651d"; ctx.fillRect(x - 8, 66, 16, 8); } else { arm(0); ctx.fillStyle = "#b5651d"; ctx.fillRect(x - 5, 66, 10, 8); } } };
/* a root-tip cell in phase ph: 0 interphase, 1 prophase, 2 metaphase, 3 anaphase, 4 telophase */
function cellDraw(ctx, w, h, ph) {
  const cx = w / 2, cy = h / 2, W = 120, H = 90; ctx.strokeStyle = "#6b6b68"; ctx.lineWidth = 1.5;
  if (ph === 4) { ctx.strokeRect(cx - W / 2, cy - H / 2, W / 2 - 2, H); ctx.strokeRect(cx + 2, cy - H / 2, W / 2 - 2, H); } else ctx.strokeRect(cx - W / 2, cy - H / 2, W, H);
  ctx.fillStyle = "#b23a48"; ctx.strokeStyle = "#b23a48"; ctx.lineWidth = 3;
  const chrom = (x, y, a) => { ctx.beginPath(); ctx.moveTo(x - 7 * Math.cos(a), y - 7 * Math.sin(a)); ctx.lineTo(x + 7 * Math.cos(a), y + 7 * Math.sin(a)); ctx.stroke(); };
  if (ph === 0) { ctx.fillStyle = "#f4d3d7"; ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 7); ctx.fill(); ctx.fillStyle = "#b23a48"; for (let i = 0; i < 18; i++) { ctx.fillRect(cx - 15 + (i * 7) % 30, cy - 14 + Math.floor(i / 5) * 8, 2, 2); } }
  if (ph === 1) { ctx.lineWidth = 1; ctx.strokeStyle = "#6b6b68"; ctx.beginPath(); ctx.arc(cx, cy, 24, 0, 7); ctx.stroke(); ctx.lineWidth = 3; ctx.strokeStyle = "#b23a48"; [[-10, -8, 0.4], [6, -10, 1.6], [-4, 6, 2.6], [10, 8, 0.9], [-12, 10, 1.2]].forEach(([dx, dy, a]) => chrom(cx + dx, cy + dy, a)); }
  if (ph === 2) { for (let i = -2; i <= 2; i++) chrom(cx, cy + i * 12, 0); ctx.lineWidth = 0.6; ctx.strokeStyle = "#6b6b68"; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(cx - 50, cy); ctx.lineTo(cx - 7, cy + i * 12); ctx.moveTo(cx + 50, cy); ctx.lineTo(cx + 7, cy + i * 12); ctx.stroke(); } }
  if (ph === 3) { for (let i = -2; i <= 2; i++) { chrom(cx - 26, cy + i * 9, 0.3 * i); chrom(cx + 26, cy + i * 9, -0.3 * i); } }
  if (ph === 4) { ctx.fillStyle = "#f4d3d7"; [cx - W / 4, cx + W / 4].forEach(x => { ctx.beginPath(); ctx.arc(x, cy, 15, 0, 7); ctx.fill(); }); }
  ctx.lineWidth = 1;
}
Kit.run({ id: "b145_lesson21", num: 21, version: 2, stages: [
  { type: "order", title: "Packing two meters of DNA", tip: "Largest scale last: each level is a tighter coil.",
    voice: ["Two meters of DNA per cell, fitted into a nucleus. Histones are the spools; open chromatin has genes on, closed has them off."],
    items: ["Double helix of DNA", "DNA wrapped around a histone core: a nucleosome", "Beads on a string: nucleosomes in a row", "A coiled, looped chromatin fiber", "A condensed chromosome at mitosis"] },
  { type: "pick", title: "Chromosomes and chromatids", tip: "Before S phase a chromosome is one chromatid. After S phase it is two sister chromatids joined at the centromere.",
    voice: ["Chromatid and chromosome are the same thing before duplication; after duplication, a chromosome holds two sister chromatids.", "Karyotype: chromosomes numbered by size. Trisomy 21 is Down syndrome."],
    qs: [
      { q: "A human cell in G1 has how many chromosomes?", ok: "46", no: ["23", "92", "44"], why: "Diploid." },
      { q: "The same cell in G2 (after S) has how many chromosomes and chromatids?", ok: "46 chromosomes, 92 chromatids", no: ["92 chromosomes, 92 chromatids", "46 chromosomes, 46 chromatids", "23 chromosomes, 46 chromatids"], why: "Chromosome number counts centromeres." },
      { q: "How many chromatids does this cell's chromosome have?", ok: "Two sister chromatids", no: ["One", "Four", "None"], draw: chromo(3, true), w: 340, h: 140, why: "Duplicated and joined at the centromere." },
      { q: "How many chromosomes are shown, and are they duplicated?", ok: "Three, not duplicated", no: ["Six, duplicated", "Three, duplicated", "Six, not duplicated"], draw: chromo(3, false), w: 340, h: 140, why: "One chromatid each, before S phase." },
      { q: "A person has three copies of chromosome 21. This is…", ok: "Trisomy 21: Down syndrome", no: ["Monosomy 21", "A balanced translocation", "A duplicated chromatid"], why: "Trisomy 1 never survives; sex chromosome anomalies are milder." },
      { q: "A salamander has a genome many times larger than a human's. This shows…", ok: "Genome size does not track complexity", no: ["Salamanders are more complex", "Big genomes code more proteins", "Humans lost DNA"], why: "Most DNA does nothing useful." }] },
  { type: "order", title: "The cell cycle", tip: "Interphase is not rest.",
    voice: ["A daughter cell starts half-size: it must grow, duplicate DNA, grow again, then divide.", "Skeletal muscle does mitosis without cytokinesis."],
    items: ["G1: the cell grows", "S: DNA is duplicated", "G2: the cell grows again and prepares", "M: mitosis separates the sister chromatids", "Cytokinesis divides the cytoplasm"] },
  { type: "classify", title: "Count the phases", tip: "A field of dividing root-tip cells, one at a time. Interphase: a round nucleus, chromatin spread out. Prophase: chromosomes condensed inside the nucleus. Metaphase: chromosomes lined up across the middle. Anaphase: two groups pulling apart. Telophase: two new nuclei, the cell pinching or walling in two.",
    voice: ["Interphase is not rest. A cell spends most of its life there.", "Count enough cells and the counts tell you how long each phase takes: a phase twice as long shows up in twice as many cells."],
    solved: "Most cells are in interphase. The share of cells in a phase is the share of the cycle spent in it: in a 24-hour cycle, 3% of cells in metaphase means about 43 minutes of metaphase.",
    bins: ["Interphase", "Prophase", "Metaphase", "Anaphase", "Telophase"], n: 40, ratio: 100,
    make: () => { const r = Math.random(), ph = r < 0.82 ? 0 : r < 0.89 ? 1 : r < 0.93 ? 2 : r < 0.96 ? 3 : 4; return { q: "", bin: ph, w: 170, h: 120, draw: (ctx, w, h) => cellDraw(ctx, w, h, ph) }; } },
  { type: "pick", title: "From counts to hours", tip: "If cells are dividing steadily and out of step with each other, the share caught in a phase equals the share of time spent in it.",
    voice: ["The counts are the data."],
    qs: [
      { q: "A root tip's cells divide every 24 hours. Of 200 cells, 6 are in metaphase. How long is metaphase?", ok: "About 43 minutes", no: ["About 6 hours", "About 3 minutes", "About 6 minutes"], why: "6/200 = 3% of 24 hours = 0.72 h." },
      { q: "Of 200 cells, 170 are in interphase. What share of the cycle is interphase?", ok: "85%", no: ["17%", "50%", "100%"], why: "170/200." },
      { q: "A drug stops cells at metaphase. After a few hours, the count of metaphase cells…", ok: "Rises, as cells pile up there", no: ["Falls to zero", "Stays the same", "Rises in interphase only"], why: "This is how chemotherapy that blocks spindles shows up under the microscope." }] },
  { type: "drill", title: "Cards", voice: ["Type each term. Two right in a row masters a card."],
    bank: ["histone", "chromatin", "nucleosome", "chromosome", "chromatid", "centromere", "kinetochore", "karyotype", "trisomy", "interphase", "G1", "S", "G2", "prophase", "metaphase", "anaphase", "telophase", "cytokinesis", "spindle"],
    cards: [
      C("The proteins DNA wraps around.", ["histones", "histone"]), C("DNA plus its proteins.", "chromatin"),
      C("Open chromatin means the genes are…", ["on", "expressed"]), C("Closed chromatin means the genes are…", ["off", "silent"]),
      C("A DNA-histone bead.", ["nucleosome", "nucleosomes"]),
      C("Two identical copies of a chromosome joined together.", ["sister chromatids", "sister chromatid"]),
      C("The region that joins sister chromatids.", "centromere"), C("The protein structure where spindle fibers attach.", "kinetochore"),
      C("An organized picture of an individual's chromosomes.", "karyotype"), C("Having three copies of one chromosome.", "trisomy"),
      C("Which phase duplicates DNA?", ["s", "s phase", "synthesis"]), C("The first growth phase.", ["g1"]), C("The second growth phase.", ["g2"]),
      C("G1, S and G2 together are…", "interphase"),
      C("Chromosomes condense.", "prophase"), C("Chromosomes line up at the middle.", "metaphase"), C("Sister chromatids pull apart.", "anaphase"), C("Nuclei re-form.", "telophase"),
      C("Dividing the cytoplasm.", "cytokinesis"), C("The array of microtubules that moves chromosomes.", ["spindle", "mitotic spindle"])] }
] });

</script>
