<body>
<header><h1>Lesson 22</h1></header>

<script src="../assets/hover.js"></script>

<script>
const C = (q, a) => ({ q, a });
/* where does a cell stop? */
const fate = S => {
  if (!S.suppress && S.onco) return { stop: null, msg: "No brakes and the accelerator stuck on: it divides regardless" };
  if (!S.growth) return { stop: "G1/S checkpoint", msg: "No growth signal: held at the G1/S checkpoint (or G0)" };
  if (S.damage && S.suppress) return { stop: "G1/S checkpoint", msg: "DNA damage: tumor suppressors hold the cell at G1/S" };
  if (!S.attached && S.suppress) return { stop: "spindle checkpoint (metaphase)", msg: "An unattached chromosome: held at the spindle checkpoint" };
  if (S.damage || !S.attached) return { stop: null, msg: "Checkpoints gone: damaged or unbalanced cell divides anyway" };
  return { stop: null, msg: "All clear: the cell completes mitosis" };
};
const ckDraw = (S, reveal) => (ctx, w, h) => {
  const f = fate(S), stops = ["G1/S checkpoint", "G2/M checkpoint", "spindle checkpoint (metaphase)"], xs = [90, 250, 410]; ctx.font = "12px sans-serif";
  ctx.strokeStyle = "#6b6b68"; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(30, 60); ctx.lineTo(w - 30, 60); ctx.stroke(); ctx.lineWidth = 1;
  stops.forEach((s, i) => { ctx.fillStyle = !reveal ? "#e2e0d9" : f.stop === s ? "#a8331a" : "#4a7a2a"; ctx.beginPath(); ctx.arc(xs[i], 60, 13, 0, 7); ctx.fill(); ctx.fillStyle = "#1d1d1b"; ctx.fillText(s.replace(" (metaphase)", ""), xs[i] - 40, 96); });
  ctx.fillStyle = "#1d1d1b"; ctx.fillText("G1 → S → G2 → M", 30, 28); if (reveal) { ctx.fillStyle = "#6b6b68"; ctx.fillText(f.msg, 30, 122); }
};
function spindle(ctx, w, h, t) {
  const pole = 40, k0 = 360, k = k0 - 170 * t, band = 230; ctx.strokeStyle = "#4a7a2a"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(pole, 60); ctx.lineTo(k, 60); ctx.stroke(); ctx.lineWidth = 1;
  if (band < k) { ctx.fillStyle = "#fafaf7"; ctx.fillRect(band - 8, 50, 16, 20); }
  ctx.fillStyle = "#1d1d1b"; ctx.beginPath(); ctx.arc(pole, 60, 8, 0, 7); ctx.fill(); ctx.fillRect(k, 45, 10, 30);
  ctx.font = "12px sans-serif"; ctx.fillText("pole", pole - 12, 95); ctx.fillText("chromosome", k - 20, 95); ctx.fillText(t ? "later in anaphase" : "just after bleaching (gap = bleached band)", 10, 115);
}
Kit.run({ id: "b145_lesson22", num: 22, version: 3, stages: [
  { type: "pick", title: "Where does it stop?", tip: "The default is stop. G1/S, G2/M and the spindle assembly checkpoint each need a green light; there is no checkpoint in S phase. A growth signal raises cyclins; tumor suppressors are brakes; an oncogene is an accelerator stuck on.",
    voice: ["Checkpoint proteins block progress; CDKs degrade the blockers, but need their cyclin partner. Cyclin levels oscillate.", "Multicellularity requires restraint. Cancer needs several mutations."],
    solved: "A healthy cell stops at G1/S without a growth signal or with damaged DNA, and at the spindle checkpoint with an unattached chromosome. Only with the brakes gone does a damaged cell divide.",
    qs: [
      [{ growth: true, damage: false, attached: true, suppress: true, onco: false }, "Growth signal, healthy DNA, every chromosome attached."],
      [{ growth: false, damage: false, attached: true, suppress: true, onco: false }, "No growth signal. Everything else healthy."],
      [{ growth: true, damage: true, attached: true, suppress: true, onco: false }, "Growth signal, but the DNA is damaged."],
      [{ growth: true, damage: false, attached: false, suppress: true, onco: false }, "Growth signal and healthy DNA, but one chromosome has no spindle fiber on its kinetochore."],
      [{ growth: true, damage: true, attached: true, suppress: false, onco: false }, "Damaged DNA, and both copies of a tumor suppressor gene broken."],
      [{ growth: false, damage: false, attached: true, suppress: false, onco: true }, "No growth signal, but an oncogene stuck on and the tumor suppressors broken."]
    ].map(([S, txt]) => { const f = fate(S), word = f.stop ? "Stops at the " + f.stop.replace(" (metaphase)", "") : "Divides";
      return { q: txt + " What does the cell do?", ok: word, no: ["Stops at the G1/S checkpoint", "Stops at the spindle checkpoint", "Divides"].filter(x => x !== word), w: 560, h: 130, draw: ckDraw(S, false), after: ckDraw(S, true), why: f.msg }; }) },
  { type: "pick", title: "Watching the spindle", tip: "Tubulin tagged so it glows. A laser bleaches a dark band across the spindle fibers between a chromosome and its pole. Then anaphase: the chromosome moves toward the pole.",
    voice: ["Microtubules grow at random and stop when they catch a kinetochore. The cell has no eyes or hands."],
    solved: "The dark band stays where it was while the chromosome closes in on it: the fiber is taken apart at the kinetochore end, and the kinetochore walks toward the pole.",
    qs: [
      { q: "As the chromosome moves toward the pole, the bleached band…", ok: "Stays put, and the chromosome closes in on it", no: ["Moves toward the pole with the chromosome", "Moves away from the pole", "Spreads evenly along the fiber"], w: 460, h: 120,
        draw: (ctx, w, h) => spindle(ctx, w, h, 0), after: (ctx, w, h) => spindle(ctx, w, h, 1), why: "So the fiber shortens at the kinetochore end: the kinetochore eats its way along." },
      { q: "A cell's M cyclin can't be broken down. What happens?", ok: "It stays stuck in mitosis", no: ["It skips mitosis", "It divides faster forever", "Nothing: cyclins don't matter in M"], why: "CDK stays active; cyclin levels have to fall to finish." }] },
  { type: "classify", title: "Split the cell", solved: "Animals pinch, plants build a wall from the middle out, bacteria split with an FtsZ ring.", tip: "Three ways to make two cells.",
    voice: ["Animals and fungi pinch with actin and myosin. Plants build a wall from the middle outward. Prokaryotes divide by binary fission with an FtsZ ring."],
    bins: ["Animals and fungi", "Plants", "Prokaryotes"],
    items: [["A contractile ring of actin and myosin pinches the cell", 0], ["Vesicles line up at the midline and fuse to build a new cell wall", 1], ["The cell wall is a box, so the new wall is built inside", 1], ["Binary fission", 2], ["An FtsZ ring", 2], ["A cleavage furrow", 0]] },
  { type: "pick", title: "Control, cancer, and treatment", solved: "Cancer is several brakes failing; chemotherapy hits every cell that divides fast.", tip: "Cancer needs more than one mutation.",
    voice: ["Growth hormone raises cyclins. Tumor suppressors are brakes. Chemotherapy poisons cells with cyclins: hair, stomach lining, blood.", "Asexual reproduction is mitosis that separates: hydra budding makes clones."],
    qs: [
      { q: "A CDK is active only when it has…", ok: "Its cyclin partner", no: ["ATP only", "A kinetochore", "A spindle"], why: "Cyclin levels oscillate, driving the cycle." },
      { q: "Which cells are non-dividing (G0) in an adult?", ok: "Neurons and cardiac muscle", no: ["Skin and gut lining", "Bone marrow", "Hair follicles"], why: "Tardigrades too." },
      { q: "Chemotherapy causes hair loss and anemia because…", ok: "It poisons all rapidly dividing cells", no: ["It targets only tumors", "It targets neurons", "It cuts DNA at the telomere"], why: "Narrow therapeutic window." },
      { q: "Losing a tumor suppressor is like…", ok: "Cutting the brake line", no: ["Pressing the accelerator", "Adding fuel", "Turning the steering wheel"], why: "An oncogene is a stuck accelerator." },
      { q: "Why does a single mutation rarely cause cancer?", ok: "Several checkpoints must fail before uncontrolled division", no: ["Mutations are rare in the tumor suppressors", "Cells repair mutations perfectly", "Cancer is caused by viruses only"], why: "Needs multiple mutations." }] },
  { type: "drill", title: "Cards", voice: ["Type each term. Two right in a row masters a card."],
    bank: ["G0", "checkpoint", "cyclin", "CDK", "tumor suppressor", "oncogene", "p53", "apoptosis", "cytokinesis", "cleavage furrow", "cell plate", "binary fission", "FtsZ", "chemotherapy", "spindle assembly checkpoint", "mitosis"],
    cards: [
      C("The non-dividing state.", ["g0"]), C("A control point where the cycle can halt.", ["checkpoint", "a checkpoint"]),
      C("Is there a checkpoint during S phase? (yes or no)", "no"),
      C("The protein whose levels oscillate to drive the cycle.", ["cyclin", "cyclins"]), C("The kinase that needs a cyclin partner.", ["cdk", "cyclin-dependent kinase"]),
      C("A gene whose normal job is to stop division.", ["tumor suppressor", "tumor suppressor gene"]), C("A gene whose overactive form drives division.", ["oncogene", "oncogenes"]),
      C("The default state of a checkpoint is to…", ["stop", "block", "halt"]),
      C("The checkpoint that checks that every kinetochore is attached.", ["spindle assembly checkpoint", "spindle checkpoint", "spindle"]),
      C("The animal cell's pinch.", ["cleavage furrow"]), C("The plant cell's new wall as it forms.", ["cell plate"]),
      C("Prokaryotes divide by…", ["binary fission"]), C("The ring protein of binary fission.", ["ftsz"]),
      C("Drugs that poison dividing cells.", ["chemotherapy", "chemo"]),
      C("Mitosis that produces clones, as in hydra budding, is ___ reproduction.", ["asexual"])] }
] });

</script>
