<body>
<header><h1>Lesson 32</h1></header>
<div id="score-name" style="max-width:1300px; margin:16px auto 0; padding:0 24px;"></div>
<nav class="toc" id="toc"></nav>
<div id="kit"></div>
<div class="done-banner" id="done-banner"></div>
<div id="score-final" style="max-width:1300px; margin:0 auto; padding:0 24px 40px;"></div>
<script src="../assets/pips.js"></script>
<script src="../assets/score.js"></script>

<script>
const C = (q, a) => ({ q, a });
/* A reading frame: AUG and four more codons, none a stop. One change to it: a base swapped (silent, missense or nonsense,
   whichever the swap gives) or a base added or lost (frameshift). Both versions are shown with their amino acids. */
const NONSTOP = [];
for (const x of "UCAG") for (const y of "UCAG") for (const z of "UCAG") { const c = x + y + z; if (Code.aa(c) !== "Stop") NONSTOP.push(c); }
function frameHtml(m) {
  const cods = []; for (let i = 0; i < m.length; i += 3) cods.push(m.slice(i, i + 3));
  let stopped = false;
  const aas = cods.map(c => { if (stopped || c.length < 3) return ""; const a = Code.aa(c); if (a === "Stop") stopped = true; return a; });
  return '<table class="mono" style="border-collapse:collapse;margin:4px 0"><tr>' + cods.map(c => '<td style="padding:1px 6px;text-align:center">' + c + "</td>").join("") + "</tr><tr>" +
    aas.map(a => '<td style="padding:1px 6px;text-align:center;color:' + (a === "Stop" ? "#a8331a" : "#6b6b68") + '">' + a + "</td>").join("") + "</tr></table>";
}
const mutQ = () => {
  const frame = ["AUG"].concat(Array.from({ length: 4 }, () => pick(NONSTOP))), k = rint(1, 3), cod = frame[k], kind = pick(["silent", "missense", "nonsense", "frameshift"]);
  let after;
  if (kind === "frameshift") {
    const i = rint(0, 2), m = frame.join(""), at = k * 3 + i;
    after = Math.random() < 0.5 ? m.slice(0, at) + m.slice(at + 1) : m.slice(0, at) + pick("ACGU".split("")) + m.slice(at);
  } else {
    const opts = [];
    for (let i = 0; i < 3; i++) for (const b of "ACGU") { if (b === cod[i]) continue; const c = cod.slice(0, i) + b + cod.slice(i + 1), was = Code.aa(cod), now = Code.aa(c);
      if (kind === "nonsense" ? now === "Stop" : kind === "silent" ? now === was : now !== was && now !== "Stop") opts.push(c); }
    if (!opts.length) return mutQ();
    after = frame.slice(0, k).concat([pick(opts)], frame.slice(k + 1)).join("");
  }
  return { q: "One change to the gene. Before:" + frameHtml(frame.join("")) + "After:" + frameHtml(after) + "This mutation is…", a: kind };
};
Kit.run({ id: "b145_lesson32", num: 32, version: 2, stages: [
  { type: "sim", title: "A clock and a moving front", tip: "Two signals. The clock: an mRNA that switches its own gene off, decays, and lets the gene switch on again, so it rises and falls; the faster the mRNA decays, the faster the clock. The front: the tail grows away from the head, and cells left behind by the growing tail settle. Each tick of the clock, the cells that have just settled become one segment. Clock period here = 4 min + 4 × the mRNA half-life (a made-up rule of the right shape).",
    solved: "Segment number is growth time divided by the clock's period; segment size is growth speed times the period. Same genes, different rates: a snake's clock ticks fast relative to its growth.",
    voice: ["Segmenting a body without a counter, and with nothing supervising. Cells read where they are and when it is.", "Snakes have hundreds of vertebrae, frogs a handful. Same genes."],
    w: 640, h: 220,
    controls: [{ id: "hl", label: "Clock mRNA half-life", min: 1, max: 30, step: 0.5, val: 10, fmt: v => v + " min" }, { id: "v", label: "Tail growth speed", min: 1, max: 10, step: 0.5, val: 3, fmt: v => v + " µm/min" }, { id: "d", label: "How long the tail grows", min: 2, max: 40, step: 0.5, val: 10, fmt: v => v + " h" }],
    readout: S => { const P = 4 + 4 * S.hl, n = Math.floor(S.d * 60 / P), sz = S.v * P; return "clock period: <b>" + P + " min</b> · segments: <b>" + n + "</b> · each segment: <b>" + Math.round(sz) + " µm</b> · body: <b>" + (n * sz / 1000).toFixed(1) + " mm</b>"; },
    draw(ctx, w, h, S) {
      const P = 4 + 4 * S.hl, n = Math.floor(S.d * 60 / P), sz = S.v * P, L = n * sz, scale = (w - 40) / Math.max(L, 12000);
      ctx.strokeStyle = "#2f6b8f"; ctx.lineWidth = 2; ctx.beginPath();
      for (let x = 0; x <= w - 40; x++) { const tmin = x / (w - 40) * 240, y = 50 - 28 * Math.cos(2 * Math.PI * tmin / P); x ? ctx.lineTo(20 + x, y) : ctx.moveTo(20 + x, y); }
      ctx.stroke(); ctx.lineWidth = 1; ctx.fillStyle = "#6b6b68"; ctx.font = "11px sans-serif"; ctx.fillText("the clock over 4 hours", 22, 96);
      for (let i = 0; i < n; i++) { ctx.fillStyle = i % 2 ? "#b23a48" : "#f4d3d7"; ctx.fillRect(20 + i * sz * scale, 120, Math.max(0.5, sz * scale - (sz * scale > 3 ? 1 : 0)), 50); }
      ctx.fillStyle = "#6b6b68"; ctx.fillText("the body, head at left (scale bar: 1 mm)", 22, 190); ctx.fillStyle = "#1d1d1b"; ctx.fillRect(w - 20 - 1000 * scale, 196, 1000 * scale, 3);
    },
    goals: [
      { text: "A frog-like body: exactly 5 segments", test: S => Math.floor(S.d * 60 / (4 + 4 * S.hl)) === 5 },
      { text: "A human-like spine: 33 segments, each 100 to 150 µm long", test: S => { const P = 4 + 4 * S.hl, sz = S.v * P; return Math.floor(S.d * 60 / P) === 33 && sz >= 100 && sz <= 150; } },
      { text: "A snake: more than 200 segments in a body no longer than 6 mm", test: S => { const P = 4 + 4 * S.hl, n = Math.floor(S.d * 60 / P); return n > 200 && n * S.v * P <= 6000; } }] },
  { type: "pick", title: "Classify the mutation", tip: "Silent: same amino acid. Missense: different amino acid. Nonsense: becomes stop. Frameshift: an insertion or deletion not in multiples of three.",
    voice: ["Silent, missense, nonsense, frameshift. Inversion and duplication change bigger pieces. Silent is not always neutral."],
    qs: [0, 1, 2, 3, 4, 5].map(() => ({ make: () => { const m = mutQ(); return { q: m.q, ok: m.a, no: ["silent", "missense", "nonsense", "frameshift"].filter(x => x !== m.a), why: "" }; } })) },
  { type: "sort", title: "Somatic or germline", tip: "Somatic mutations die with the person; germline mutations are heritable.",
    voice: ["Mosaicism: half the body can differ from the other half. Germ cells are set aside early; meiotic arrest limits the number of divisions."],
    bins: ["Somatic mutation", "Germline mutation"],
    items: [["A mutation in a skin cell from sunburn", 0], ["A mutation in a developing sperm", 1], ["Passed to children", 1], ["A mosaic patch of different-colored fur", 0], ["Not inherited", 0], ["A mutation in an egg precursor", 1], ["Epithelia divide more, so these accumulate more", 0]] },
  { type: "order", title: "A retrovirus takes over", tip: "Reverse transcriptase copies RNA into DNA.",
    voice: ["The central dogma has exceptions: RNA to DNA. A retrovirus carjacks an idling car: it inserts at an expressed gene and steals the host promoter."],
    items: ["The virus binds the cell and its RNA genome enters", "Reverse transcriptase copies the RNA into DNA", "The DNA enters the nucleus and integrates into a host chromosome", "The host's own machinery transcribes the viral genes", "Viral proteins and RNA assemble into new virus particles", "New viruses bud from the cell"] },
  { type: "pick", title: "Duplicates and model organisms", tip: "A spare copy is free to change.",
    voice: ["Heir and a spare: silence the spare, free to mutate, a chance of a new function. Model organisms were chosen by accident: zebrafish from a pet store."],
    qs: [
      { q: "Why is a gene duplication useful?", ok: "One copy keeps the old job and the spare is free to evolve a new one", no: ["It doubles every protein forever", "It deletes the gene", "It silences the genome"], why: "Heir and a spare." },
      { q: "Zebrafish, Xenopus and fancy mice became model organisms because…", ok: "Of historical accident and ease of study", no: ["They are closest to humans", "They have the simplest genomes", "They were chosen by the NIH"], why: "They are better known than humans." },
      { q: "A frameshift is more damaging than a missense because…", ok: "It changes every codon after the mutation", no: ["It always makes a stop", "It adds an amino acid", "It changes only one codon"], why: "Reading frame." },
      { q: "A silent mutation changes the DNA but not the amino acid. It is not always neutral because…", ok: "Synonymous codons are translated at different rates", no: ["It changes the protein", "It deletes the gene", "It makes a stop"], why: "Not all codons are equal." }] },
  { type: "drill", title: "Cards", voice: ["Type each term. Two right in a row masters a card."],
    bank: ["silent", "missense", "nonsense", "frameshift", "inversion", "duplication", "somatic", "germline", "mosaic", "reverse transcriptase", "retrovirus", "integrase", "somite", "model organism"],
    cards: [
      { make: () => { const m = mutQ(); return { q: m.q, a: m.a }; } },
      { make: () => { const m = mutQ(); return { q: m.q, a: m.a }; } },
      { make: () => { const m = mutQ(); return { q: m.q, a: m.a }; } },
      { make: () => { const m = mutQ(); return { q: m.q, a: m.a }; } },
      C("A change that gives the same amino acid.", ["silent", "silent mutation"]), C("A change that gives a different amino acid.", ["missense", "missense mutation"]),
      C("A change that gives a stop codon.", ["nonsense", "nonsense mutation"]), C("An insertion or deletion not in multiples of three.", ["frameshift", "frameshift mutation"]),
      C("A segment of DNA flipped end to end.", ["inversion"]), C("An extra copy of a segment.", ["duplication", "gene duplication"]),
      C("Mutations in body cells are…", ["somatic"]), C("Mutations in the cells that make gametes are…", ["germline", "germ line"]),
      C("A person with two genetically different populations of cells.", ["mosaic", "a mosaic", "mosaicism"]),
      C("The enzyme that copies RNA into DNA.", ["reverse transcriptase"]), C("A virus with an RNA genome that makes DNA.", ["retrovirus", "a retrovirus"]),
      C("A block of tissue that becomes vertebrae and muscle.", ["somite", "somites"]),
      C("An organism studied to learn about others, such as the zebrafish.", ["model organism", "a model organism"])] }
] });

</script>
