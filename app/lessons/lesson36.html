<script>
const C = (q, a) => ({ q, a });
const dna = "…ATGGCATTACGCGTTGACCGG…";
const edit = S => !S.match ? { word: "Nothing: it is not cut", out: "No match, no cut: Cas9 leaves the DNA alone, template or not.", cut: false }
  : S.tmpl ? { word: "Precisely changed: the template's base is copied in", out: "Cut, then the cell copies the template.", cut: true, fix: true }
  : { word: "Knocked out: a few bases lost or added, the reading frame shifts", out: "Cut, then sloppy end joining: an insertion or deletion, usually a frameshift.", cut: true, fix: false };
const editDraw = (S, reveal) => (ctx, w, h) => {
  const e = edit(S); ctx.font = "600 15px ui-monospace,Menlo,monospace"; ctx.fillStyle = "#1d1d1b";
  ctx.fillText("DNA  " + (!reveal || !e.cut ? dna : e.fix ? "…ATGGCATAACGCGTTGACCGG…" : "…ATGGCATTA  GTTGACCGG…"), 20, 50);
  ctx.fillStyle = S.match ? "#4a7a2a" : "#a8331a"; ctx.fillRect(110, 70, 220, 12); ctx.fillStyle = "#1d1d1b"; ctx.font = "12px sans-serif"; ctx.fillText("guide RNA" + (S.tmpl ? "   +   repair template" : ""), 110, 100);
  if (reveal && e.cut) { ctx.strokeStyle = "#a8331a"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(215, 20); ctx.lineTo(235, 58); ctx.stroke(); ctx.lineWidth = 1; }
  ctx.fillStyle = "#6b6b68"; ctx.fillText(reveal ? e.out : "", 20, 135);
};
Kit.run({ id: "b145_lesson36", num: 36, version: 2, stages: [
  { type: "order", title: "CRISPR in bacteria", tip: "A bacterial immune system: clustered regularly interspaced short palindromic repeats.",
    voice: ["Phage siege: surviving bacteria had defenses. Cas1 and Cas2 capture viral DNA and store it as a spacer between repeats in the CRISPR locus.", "A guide RNA has a constant part and a variable part, like an antibody. Cas9 cuts what the guide matches."],
    items: ["A phage injects its DNA", "Cas1 and Cas2 capture a piece of it", "The piece is stored as a spacer in the CRISPR locus", "The locus is transcribed into guide RNAs", "Cas9 with a guide RNA finds the matching viral DNA", "Cas9 cuts the viral DNA"] },
  { type: "pick", title: "Predict the edit", tip: "Cas9 cuts both strands where its 20-base guide RNA matches the DNA. The cell repairs the cut itself: joining the ends directly is sloppy and usually adds or loses a few bases; given a repair template with matching ends, it copies the template instead.",
    solved: "Cas9 only cuts where the guide matches. What the gene becomes depends on the cell's repair: sloppy joining knocks it out with a frameshift; a template writes in a precise change.",
    voice: ["Make a custom guide. The cell does the repair."],
    qs: [
      [{ match: false, tmpl: false }, "Cas9 with a guide that matches nothing in this gene."],
      [{ match: true, tmpl: false }, "Cas9 with a matching guide; no template."],
      [{ match: true, tmpl: true }, "Cas9 with a matching guide, plus a repair template carrying one changed base."],
      [{ match: false, tmpl: true }, "A template, but a guide that matches nothing in this gene."]
    ].map(([S, txt]) => { const e = edit(S); return { q: txt + " What happens to the gene?", ok: e.word, no: ["Nothing: it is not cut", "Knocked out: a few bases lost or added, the reading frame shifts", "Precisely changed: the template's base is copied in"].filter(x => x !== e.word), w: 640, h: 150, draw: editDraw(S, false), after: editDraw(S, true), why: e.out }; }) },
  { type: "order", title: "Casgevy for sickle cell disease", tip: "Edit the cells outside the body, then put them back.",
    voice: ["A point mutation in β-hemoglobin. The therapy reactivates fetal hemoglobin. Bone marrow out, edit ex vivo, ablate the marrow, reinfuse."],
    items: ["Stem cells are taken from the patient's bone marrow", "The cells are edited in the lab to reactivate fetal hemoglobin", "The patient's own marrow is cleared with chemotherapy", "The edited cells are infused back", "They settle in the marrow and make red cells with fetal hemoglobin"] },
  { type: "sort", title: "The omes", tip: "Closer to phenotype means harder to measure.",
    voice: ["The genome is fixed; expression varies with stress, hunger and cancer. A liver and a pancreas cell: same genome, different expression."],
    bins: ["Genomics", "Epigenomics", "Transcriptomics", "Proteomics", "Metabolomics"],
    items: [["The complete DNA sequence", 0], ["Which histones and cytosines are modified", 1], ["Every mRNA being made in a cell right now", 2], ["Every protein present, with no universal handle to tag them", 3], ["Glucose, lactate and other small molecules", 4], ["Variants present in every cell of the body", 0], ["RNA-seq", 2], ["Mass spectrometry of proteins", 3]] },
  { type: "pick", title: "Bioinformatics and the closing theme", tip: "Biotechnology steals from nature.",
    voice: ["Statistics on omics data: dimensionality reduction, clustering by tissue, regression, deep learning. Foldit lets players fold proteins.", "Taq, restriction enzymes, reverse transcriptase, CRISPR: stolen from nature. Are viruses alive?"],
    qs: [
      { q: "Cells cluster by tissue in an expression dataset because…", ok: "Different tissues turn on different genes from the same genome", no: ["Their DNA differs", "They have different chromosomes", "Clustering invents groups"], why: "Dimensionality reduction makes this visible." },
      { q: "Which tool came from a hot-spring bacterium?", ok: "Taq polymerase", no: ["Reverse transcriptase", "Cas9", "EcoRI"], why: "Thermus aquaticus." },
      { q: "Which tool came from a virus?", ok: "Reverse transcriptase", no: ["Taq polymerase", "Restriction enzymes", "Agarose"], why: "Retroviruses." },
      { q: "Restriction enzymes evolved as a bacterial defense against…", ok: "Viruses (phages)", no: ["Starvation", "Heat", "Antibiotics"], why: "Like CRISPR." },
      { q: "A guide RNA is like an antibody in that…", ok: "Part is constant and part is variable to fit a target", no: ["It is a protein", "It is made by the host", "It cuts DNA itself"], why: "Constant region plus a variable region." },
      { q: "In the book (chapter 17), making an organism with a gene from another species is…", ok: "Making a transgenic (genetically modified) organism", no: ["Cloning an individual", "Gene therapy only", "DNA fingerprinting"], why: "Cloning copies a whole genome; transgenics add a gene." }] },
  { type: "drill", title: "Cards", voice: ["Type each term. Two right in a row masters a card."],
    bank: ["CRISPR", "Cas9", "guide RNA", "spacer", "PAM", "phage", "non-homologous end joining", "knockout", "template", "genomics", "epigenomics", "transcriptomics", "proteomics", "metabolomics", "bioinformatics", "ex vivo", "fetal hemoglobin", "transgenic"],
    cards: [
      C("The bacterial immune system adapted for genome editing.", ["crispr", "crispr-cas9"]),
      C("The enzyme that cuts the DNA.", ["cas9"]), C("The RNA that tells Cas9 where to cut.", ["guide rna", "grna", "sgrna"]),
      C("Viral DNA stored in the CRISPR locus.", ["spacer", "spacers"]),
      C("Which two proteins capture new spacers? (Cas1 and ___)", ["cas2"]),
      C("A virus that infects bacteria.", ["phage", "bacteriophage"]),
      C("Sloppy repair that joins cut ends.", ["non-homologous end joining", "nhej", "non homologous end joining"]),
      C("Disabling a gene is a gene…", ["knockout", "knock out", "knockout"]),
      C("Precise edits need the cell to copy a repair…", ["template", "a template"]),
      C("Study of all DNA.", ["genomics"]), C("Study of chemical marks on DNA and histones.", ["epigenomics"]),
      C("Study of all RNA transcripts.", ["transcriptomics"]), C("Study of all proteins.", ["proteomics"]), C("Study of all small molecules.", ["metabolomics"]),
      C("Computation and statistics on biological data.", ["bioinformatics"]),
      C("Editing cells outside the body is called ___ editing.", ["ex vivo"]),
      C("Sickle cell therapy reactivates which hemoglobin?", ["fetal hemoglobin", "fetal"]),
      C("An organism carrying a gene from another species.", ["transgenic", "gmo", "genetically modified"])] }
] });
