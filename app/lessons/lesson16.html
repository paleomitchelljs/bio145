<link rel="stylesheet" href="../assets/b145.css">

<body>
<header><h1>Lesson 16</h1></header>
<div id="score-name" style="max-width:1300px; margin:16px auto 0; padding:0 24px;"></div>
<nav class="toc" id="toc"></nav>
<div id="kit"></div>
<div class="done-banner" id="done-banner"></div>
<div id="score-final" style="max-width:1300px; margin:0 auto; padding:0 24px 40px;"></div>
<script src="../assets/pips.js"></script>
<script src="../assets/score.js"></script>
<script src="../assets/hover.js"></script>
<script src="../assets/stage.js"></script>
<script src="../assets/drill.js"></script>
<script src="../assets/kit.js"></script>
<script>
const C = (q, a) => ({ q, a });
const etc = S => { const o2 = S.o2 && !S.cn; const flow = o2 ? 1 : 0, unc = S.unc / 100; const grad = flow * (1 - 0.85 * unc), atp = 2 + (o2 ? 26 * grad + 4 : 0) + 0, heat = o2 ? 0.25 + 0.7 * unc : 0.1; return { o2, grad, atp: o2 ? 2 + 2 + 28 * grad : 4, heat: Math.min(1, heat), accum: !o2 }; };
Kit.run({ id: "b145_lesson16", num: 16, stages: [
  { type: "sim", title: "The electron transport chain", tip: "Electrons flow down the chain pumping protons; protons flowing back through ATP synthase make ATP. Oxygen takes the electrons at the end. Cyanide blocks the last carrier. An uncoupler (brown fat's UCP1) lets protons leak back and make heat.",
    voice: ["Carriers are cakes: they can't buy anything elsewhere. They are sold for cash (ATP) at the chain.", "The dam is the proton gradient; ATP synthase is the water turbine. About 40% efficient; the rest is heat, which is sometimes the point."],
    w: 620, h: 260,
    controls: [{ id: "o2", label: "Oxygen present", type: "check", val: true }, { id: "cn", label: "Cyanide", type: "check", val: false }, { id: "unc", label: "Uncoupling protein (leaky membrane)", min: 0, max: 100, step: 1, val: 0, fmt: v => v + "%" }],
    readout: S => { const e = etc(S); return "ATP per glucose ≈ <b>" + e.atp.toFixed(0) + "</b> · heat <b>" + (e.heat * 100).toFixed(0) + "%</b>" + (e.accum ? ' · <span class="off">electrons back up, NADH piles up, cell must ferment</span>' : ""); },
    draw(ctx, w, h, S) {
      const e = etc(S); ctx.font = "12px sans-serif";
      const bars = [["proton gradient", e.grad, "#2e6da4"], ["ATP", e.atp / 32, "#2e7d32"], ["heat", e.heat, "#c0392b"]];
      bars.forEach(([n, v, c], i) => { const x = 60 + i * 150; ctx.fillStyle = "#eee"; ctx.fillRect(x, 30, 80, 170); ctx.fillStyle = c; ctx.fillRect(x, 200 - 170 * v, 80, 170 * v); ctx.fillStyle = "#222"; ctx.fillText(n, x + 4, 222); });
      ctx.fillStyle = "#555"; ctx.fillText("e⁻ → chain → " + (e.o2 ? "O₂ → H₂O" : "(no acceptor)"), 60, 248);
    },
    goals: [
      { text: "Normal cell with oxygen and a tight membrane: make about 30 or more ATP", test: S => etc(S).atp >= 30 },
      { text: "Take away the oxygen: ATP falls to the glycolysis level", test: S => !S.o2 && etc(S).atp <= 4 },
      { text: "Add cyanide with oxygen present: the chain still stops", test: S => S.o2 && S.cn && etc(S).atp <= 4 },
      { text: "Turn the uncoupler up (brown fat): lots of heat, little ATP", test: S => S.o2 && !S.cn && S.unc >= 80 && etc(S).heat >= 0.8 && etc(S).atp <= 12 }] },
  { type: "pick", title: "Counting carbons and ATP", tip: "The citric acid cycle makes no oxygen-needing ATP itself; it loads carriers.",
    voice: ["Acetyl (2 carbons) joins oxaloacetate (4) to make citrate (6). Two carbons leave as CO₂ each turn; two turns per glucose.", "Weight loss is exhaled carbon: fat leaves as breath."],
    qs: [
      { q: "Citrate has six carbons. After one turn, how many carbons have left as CO₂?", ok: "2", no: ["1", "4", "6"], why: "Back to oxaloacetate, ready for the next acetyl." },
      { q: "How many turns of the cycle does one glucose drive?", ok: "2", no: ["1", "3", "6"], why: "One per acetyl-CoA, and glucose makes two." },
      { q: "Per turn the cycle captures about…", ok: "3 NADH, 1 FADH₂, 1 ATP", no: ["1 NADH, 3 FADH₂, 3 ATP", "6 NADH only", "0 carriers"], why: "Doubled per glucose." },
      { q: "Where does most of the ATP from a glucose come from?", ok: "The electron transport chain and ATP synthase", no: ["Glycolysis", "The citric acid cycle directly", "Pyruvate oxidation"], why: "Theoretical maximum about 30–32; realistic yield is lower." },
      { q: "When you lose weight, where does the carbon go?", ok: "Breathed out as CO₂", no: ["Burned as heat only", "Excreted as urine mostly", "Turned into water"], why: "Fat leaves as breath." },
      { q: "About what fraction of the energy in glucose is captured as ATP?", ok: "About 40%", no: ["About 5%", "About 100%", "About 80%"], why: "Every reaction loses some to heat, which is why we keep eating." }] },
  { type: "pick", title: "Heat and body size", tip: "Heat is inevitable; sometimes it is an advantage.",
    voice: ["Brown fat and uncoupling proteins: infants, shrews, hibernators. The leatherback sea turtle keeps warm by size (volume to surface). Desert rodents get metabolic water."],
    qs: [
      { q: "Infants have brown fat. What does it do?", ok: "Uses uncoupling proteins to turn the gradient into heat", no: ["Stores more glycogen", "Makes extra ATP", "Fixes carbon"], why: "Protons leak through UCP1 instead of ATP synthase." },
      { q: "The leatherback sea turtle stays warm in Arctic water mainly because of…", ok: "Large body size: low surface area for its volume", no: ["Thick fur", "Photosynthesis", "A very fast heartbeat"], why: "Gigantothermy." },
      { q: "A desert rodent gets water from…", ok: "Metabolic water made when O₂ takes the electrons", no: ["Sweat", "Photolysis", "Atmospheric CO₂"], why: "Oxygen + electrons + protons = H₂O." },
      { q: "A plant that melts snow around itself is using…", ok: "Heat released by respiration", no: ["Photolysis", "Fermentation", "Absorbed starlight"], why: "Heat as a benefit." },
      { q: "If oxygen runs short, the chain backs up. What does the cell lose first?", ok: "Most of its ATP", no: ["All of its glycolysis at once", "Its DNA", "Its water"], why: "Preview of fermentation." }] },
  { type: "drill", title: "Cards", voice: ["Type each term. Two right in a row masters a card."],
    bank: ["citrate", "oxaloacetate", "NADH", "FADH2", "electron transport chain", "ATP synthase", "chemiosmosis", "proton gradient", "oxygen", "cytochrome", "brown fat", "uncoupling protein", "40 percent", "heat", "30", "2"],
    cards: [
      C("The 6-carbon molecule made when acetyl joins oxaloacetate.", "citrate"), C("The 4-carbon molecule the cycle regenerates.", "oxaloacetate"),
      C("Turns of the cycle per glucose.", ["2", "two"]), C("CO₂ released per turn.", ["2", "two"]),
      C("The electron carrier that donates to the first complex.", ["nadh"]), C("The other carrier made in the cycle.", ["fadh2", "fadh₂"]),
      C("Electrons passed along carriers pump what across the membrane?", ["protons", "h+", "hydrogen ions"]),
      C("The enzyme that makes ATP from the proton flow.", ["atp synthase"]),
      C("Making ATP with a proton gradient is called…", ["chemiosmosis"]),
      C("The last electron acceptor.", ["oxygen", "o2"]),
      C("Iron-containing carriers in the chain that cyanide attacks.", ["cytochrome", "cytochromes"]),
      C("Roughly how efficient is respiration? (a percent)", ["40", "40%", "40 percent"]),
      C("The tissue with uncoupling proteins.", ["brown fat", "brown adipose tissue"]),
      C("The molecule produced when oxygen accepts electrons.", "water"),
      C("The energy lost at every step ends up as…", "heat")] }
] });

</script>
</body>
</html>
