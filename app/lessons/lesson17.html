<body>
<header><h1>Lesson 17</h1></header>
<div id="score-name" style="max-width:1300px; margin:16px auto 0; padding:0 24px;"></div>

<script>
const C = (q, a) => ({ q, a });
/* absorption curves: chlorophyll a peaks near 430 and 662 nm, b near 453 and 642 */
const g = (x, m, s) => Math.exp(-0.5 * Math.pow((x - m) / s, 2));
const absA = x => Math.min(1, 0.95 * g(x, 430, 18) + 0.85 * g(x, 662, 16) + 0.06);
const absB = x => Math.min(1, 0.9 * g(x, 455, 18) + 0.6 * g(x, 642, 14) + 0.05);
const absL = x => Math.max(absA(x), absB(x));
Kit.run({ id: "b145_lesson17", num: 17, version: 2, stages: [
  { type: "classify", title: "Feed it in", solved: "Every fuel is cut down to something glycolysis or the citric acid cycle already handles.", tip: "Everything is brought to glycolysis, acetyl-CoA, or the citric acid cycle.",
    voice: ["Polysaccharides give glucose. Glycerol joins glycolysis. Fatty acids are cut in two-carbon pieces (beta oxidation): more hydrogen, more ATP. Amino acids lose their nitrogen first (deamination)."],
    bins: ["Enters at glycolysis", "Enters as acetyl-CoA", "Enters the citric acid cycle"],
    items: [["Glycogen", 0], ["Starch", 0], ["Glycerol from a fat", 0], ["Fatty acids after beta oxidation", 1], ["Leucine, after its nitrogen is removed", 1], ["Glutamate, as α-ketoglutarate", 2], ["Aspartate, as oxaloacetate", 2]] },
  { type: "pick", title: "Nitrogen and waste", solved: "Carbon skeletons burn; the nitrogen has to be thrown away as ammonia, urea or uric acid.", tip: "Deamination removes the nitrogen from an amino acid as ammonia, which is toxic.",
    voice: ["Ammonia becomes urea (mammals) or uric acid (birds, reptiles). Animals are nitrogen thieves: bacteria and fungi fix it. Urine is fertilizer."],
    qs: [
      { q: "Burning an amino acid for energy first requires…", ok: "Removing its amino group (deamination)", no: ["Adding a phosphate", "Splitting water", "Making it a lipid"], why: "The carbon skeleton enters respiration; the nitrogen is waste." },
      { q: "Ammonia is toxic. Mammals make it into…", ok: "Urea", no: ["Starch", "Glycerol", "ATP"], why: "Birds and reptiles make uric acid." },
      { q: "Who fixes nitrogen from the air into usable forms?", ok: "Certain bacteria", no: ["Animals", "Mammals", "Sunlight"], why: "Animals are nitrogen thieves." },
      { q: "A gram of fat gives more ATP than a gram of sugar because…", ok: "Fatty acids have more hydrogen to carry to the chain", no: ["Fats contain more oxygen", "Fats skip respiration", "Fats are polar"], why: "More H means more NADH." }] },
  { type: "classify", title: "Find the electrons' last stop", solved: "Without oxygen, another acceptor (nitrate, sulfate) or none at all: fermentation only recycles NAD⁺ so glycolysis can keep going.", tip: "Fermentation regenerates NAD⁺ so glycolysis can continue; anaerobic respiration uses a different final acceptor.",
    voice: ["Pyruvate pile-up stalls glycolysis. Break glass in an emergency: reduce pyruvate to regenerate NAD⁺. Lactic acid in muscle; ethanol and CO₂ in yeast."],
    bins: ["Aerobic respiration", "Anaerobic respiration (other acceptor)", "Lactic acid fermentation", "Ethanol fermentation"],
    items: [["O₂ is the final electron acceptor", 0], ["The most ATP per glucose", 0], ["Nitrate is the final acceptor", 1], ["Sulfate is the final acceptor", 1], ["Obligate anaerobes in mud", 1], ["Sore muscles after a sprint", 2], ["Pyruvate becomes lactate", 2], ["Yeast in bread dough and beer", 3], ["Pyruvate loses CO₂ and becomes ethanol", 3]] },
  { type: "pick", title: "Earth's oxygen: banded iron", solved: "The rocks record oxygen rising and crashing until respiration balanced photosynthesis.", tip: "Banded iron formations are layers of rusted iron and unrusted iron laid down over a billion years.",
    voice: ["Red bands: oxygen was abundant, iron rusted. Black bands: it ran out, mass extinctions. The cycle ended with aerobic respiration soaking up the oxygen."],
    qs: [
      { q: "A red band in a banded iron formation records…", ok: "Oxygen was available and the iron rusted", no: ["No life existed", "The ocean froze", "Carbon dioxide dominated"], why: "Black bands are oxygen-poor times." },
      { q: "What eventually ended the cycle of red and black bands?", ok: "Aerobic respiration and a stable oxygen supply", no: ["Volcanoes stopped", "Fermentation arrived", "Iron ran out"], why: "Consumers balanced the producers." },
      { q: "Why does oxygen outcompete nitrate and sulfate as an acceptor?", ok: "It holds electrons more tightly, so more energy is released", no: ["It is cheaper", "It is heavier", "It is less reactive"], why: "Electronegativity again." },
      { q: "Hot vents support chemosynthetic bacteria. Their energy comes from…", ok: "Inorganic chemicals such as H₂S", no: ["Sunlight", "Glucose", "Oxygen from plants"], why: "Metabolic diversity." }] },
  { type: "sim", title: "Find what chlorophyll takes", solved: "Chlorophyll takes red and blue and leaves green: plants are green because they don't use it.", tip: "Pigments absorb some wavelengths and reflect the rest. Plants look green because green is left over, not preferred.",
    voice: ["Photosynthesis turns air into sugar: you are made of plants, plants of air.", "Chlorophyll absorbs red and blue and reflects green. The Skittles child who hates purple."],
    w: 640, h: 240,
    controls: [{ id: "wl", label: "Wavelength", min: 400, max: 700, step: 1, val: 550, fmt: v => v + " nm" }, { id: "pig", label: "Pigment", type: "select", opts: [["a", "Chlorophyll a"], ["b", "Chlorophyll b"], ["both", "A leaf (both)"]], val: "a" }],
    readout: S => { const f = S.pig === "a" ? absA : S.pig === "b" ? absB : absL; const a = f(S.wl); return "Absorbed <b>" + (a * 100).toFixed(0) + "%</b>; reflected <b>" + ((1 - a) * 100).toFixed(0) + "%</b>"; },
    draw(ctx, w, h, S) {
      const X = x => 20 + (x - 400) / 300 * (w - 40), f = S.pig === "a" ? absA : S.pig === "b" ? absB : absL;
      for (let x = 400; x < 700; x += 3) { const hue = 270 - (x - 400) / 300 * 270; ctx.fillStyle = "hsl(" + hue + ",85%,55%)"; ctx.fillRect(X(x), 200, 12, 20); }
      ctx.strokeStyle = "#1d1d1b"; ctx.lineWidth = 2; ctx.beginPath(); for (let x = 400; x <= 700; x += 2) { const y = 190 - 150 * f(x); x === 400 ? ctx.moveTo(X(x), y) : ctx.lineTo(X(x), y); } ctx.stroke();
      ctx.fillStyle = "#b23a48"; ctx.fillRect(X(S.wl) - 1, 30, 3, 190); ctx.fillStyle = "#1d1d1b"; ctx.font = "12px sans-serif"; ctx.fillText("absorption", 24, 22);
    },
    goals: [
      { text: "Find chlorophyll a's blue peak (about 430 nm): absorbed over 90%", test: S => S.pig === "a" && absA(S.wl) > 0.9 && S.wl < 480 },
      { text: "Find chlorophyll a's red peak (about 662 nm): absorbed over 80%", test: S => S.pig === "a" && absA(S.wl) > 0.8 && S.wl > 600 },
      { text: "Find the green trough in a leaf: under 20% absorbed", test: S => S.pig === "both" && S.wl >= 500 && S.wl <= 600 && absL(S.wl) < 0.2 },
      { text: "Chlorophyll b: find its blue peak (about 455 nm), over 85%", test: S => S.pig === "b" && absB(S.wl) > 0.85 }] },
  { type: "drill", title: "Cards", voice: ["Type each term. Two right in a row masters a card."],
    bank: ["deamination", "beta oxidation", "ammonia", "urea", "uric acid", "fermentation", "NAD+", "lactic acid", "ethanol", "anaerobic respiration", "nitrate", "sulfate", "chemosynthesis", "chlorophyll", "green", "red", "blue", "photosynthesis", "net primary productivity"],
    cards: [
      C("Removing the amino group from an amino acid.", ["deamination"]),
      C("Cutting a fatty acid into two-carbon pieces.", ["beta oxidation", "β oxidation", "β-oxidation"]),
      C("The toxic nitrogen waste from deamination.", ["ammonia", "nh3"]), C("The nitrogen waste mammals excrete.", ["urea"]), C("The nitrogen waste of birds and reptiles.", ["uric acid"]),
      C("The molecule that fermentation regenerates so glycolysis can continue.", ["nad+", "nad", "nad⁺"]),
      C("Fermentation in tired muscle makes…", ["lactic acid", "lactate"]), C("Fermentation in yeast makes CO₂ and…", ["ethanol", "alcohol"]),
      C("Respiration using nitrate or sulfate as the final acceptor.", ["anaerobic respiration", "anaerobic"]),
      C("Making energy from inorganic chemicals at hydrothermal vents.", ["chemosynthesis"]),
      C("The main photosynthetic pigment.", ["chlorophyll"]),
      C("The color plants reflect.", ["green"]),
      C("Chlorophyll absorbs red and which other color?", ["blue", "violet", "blue-violet"]),
      C("The gas released by photosynthesis.", ["oxygen", "o2"]),
      C("The net rate plants store carbon in organic matter is called net…", ["primary productivity", "net primary productivity"]),
      C("Do plant cells also respire? (yes or no)", "yes")] }
] });

</script>
