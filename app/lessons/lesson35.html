<!doctype html>

<title>BIO 145 — Lesson 35</title>
<link rel="stylesheet" href="../assets/b145.css">

<body>
<header><h1>Lesson 35</h1></header>
<div id="score-name" style="max-width:1300px; margin:16px auto 0; padding:0 24px;"></div>
<nav class="toc" id="toc"></nav>
<div id="kit"></div>
<div class="done-banner" id="done-banner"></div>
<div id="score-final" style="max-width:1300px; margin:0 auto; padding:0 24px 40px;"></div>
<script src="../assets/pips.js"></script>
<script src="../assets/score.js"></script>
<script src="../assets/hover.js"></script>
<script src="../assets/stage.js"></script>
<script src="../assets/drill.js"></script>
<script src="../assets/kit.js"></script>
<script>
const C = (q, a) => ({ q, a });
const COL = { A: "#4a7a2a", C: "#2f6b8f", G: "#1d1d1b", T: "#b23a48" };
const sanger = seq => (ctx, w, h) => { ctx.fillStyle = "#fafaf7"; ctx.fillRect(0, 0, w, h); const n = seq.length, bh = (h - 30) / n; ctx.font = "11px sans-serif"; ctx.fillStyle = "#1d1d1b"; ctx.fillText("short", w - 44, h - 6); ctx.fillText("long", w - 40, 12);
  for (let i = 0; i < n; i++) { const y = h - 18 - (i + 1) * bh + 2; ctx.fillStyle = COL[seq[i]]; ctx.fillRect(50, y, 140, bh - 5); } [["A", "A"], ["C", "C"], ["G", "G"], ["T", "T"]].forEach(([b], i) => { ctx.fillStyle = COL[b]; ctx.fillRect(220 + i * 40, 20, 14, 14); ctx.fillStyle = "#1d1d1b"; ctx.fillText(b, 238 + i * 40, 31); }); ctx.fillText("each dye = one base", 220, 52); };
const rseq = () => Array.from({ length: 7 }, () => pick("ACGT".split(""))).join("");
/* Manhattan data */
const NUL = Array.from({ length: 30000 }, () => -Math.log10(Math.random()));
const HITS = [7.5, 9.1, 6.6];
const maxNull = Math.max(...NUL);
Kit.run({ id: "b145_lesson35", num: 35, version: 2, stages: [
  { type: "sim", title: "Set the line", solved: "With 30,000 tests, p = 0.05 lets in hundreds of false hits; dividing by the number of tests keeps the real ones and drops the rest.", tip: "Each dot is a variant (SNP). Height is −log₁₀ of its p value. With 30,000 tests, a 0.05 cutoff lets in hundreds of false hits. The usual fix: divide 0.05 by the number of tests.",
    voice: ["Mendel got lucky. Most traits are polygenic, and the noncoding genome matters.", "Set the line: too low and the plot is full of false positives; too high and the true signals are lost."],
    w: 640, h: 270,
    controls: [{ id: "th", label: "Significance line (−log₁₀ p)", min: 1, max: 10, step: 0.1, val: 1.3, fmt: v => v.toFixed(1) }],
    readout: S => { const fp = NUL.filter(v => v >= S.th).length, tp = HITS.filter(v => v >= S.th).length; return "False hits above the line: <b>" + fp + "</b> · true loci found: <b>" + tp + " of 3</b>"; },
    draw(ctx, w, h, S) {
      const X = i => 30 + i / NUL.length * (w - 50), Y = v => 240 - v / 10 * 220; ctx.fillStyle = "#e2e0d9";
      NUL.forEach((v, i) => { if (i % 3) return; ctx.fillStyle = v >= S.th ? "#b23a48" : "#c9c5b8"; ctx.fillRect(X(i), Y(v), 2, 2); });
      HITS.forEach((v, i) => { for (let k = 0; k < 6; k++) { const vv = v - k * 0.5 - Math.random() * 0.02; ctx.fillStyle = vv >= S.th ? "#4a7a2a" : "#c9c5b8"; ctx.fillRect(X((i + 1) * 7000) + (k % 3) * 3, Y(Math.max(0.5, vv)), 3, 3); } });
      ctx.strokeStyle = "#b23a48"; ctx.beginPath(); ctx.moveTo(30, Y(S.th)); ctx.lineTo(w - 20, Y(S.th)); ctx.stroke(); ctx.fillStyle = "#1d1d1b"; ctx.font = "11px sans-serif"; ctx.fillText("−log₁₀ p", 2, 14);
    },
    goals: [
      { text: "Use p = 0.05 (line at 1.3): see how many false hits get in", test: S => S.th <= 1.5 && NUL.filter(v => v >= S.th).length > 500 },
      { text: "Remove every false positive (line above the highest gray dot)", test: S => S.th > maxNull && S.th < 10 },
      { text: "Remove every false positive but keep all three true loci", test: S => S.th > maxNull && HITS.every(v => v >= S.th) },
      { text: "Set it near the Bonferroni value for 30,000 tests (about 5.8)", test: S => Math.abs(S.th - 5.8) <= 0.3 }] },
  { type: "pick", title: "Reading a Sanger sequence", solved: "Shortest piece first: the gel reads bottom to top.", tip: "A chain terminator (dideoxynucleotide) with a fluorescent dye stops each new strand at one base. The shortest piece ends at the first base.",
    voice: ["PCR plus dideoxynucleotides. Four dyes. Read the gel bottom to top; a heterozygote shows mixed colors."],
    qs: [0, 1, 2].map(() => ({ make: () => { const s = rseq(); const alts = new Set([s, s.split("").reverse().join("")]); while (alts.size < 4) alts.add(rseq()); return { q: "Read the new strand from the shortest piece to the longest. (A green, C blue, G black, T red.) What is the sequence?", ok: s, no: [...alts].filter(x => x !== s), draw: sanger(s), w: 380, h: 180, why: "Each color marks the last base of a piece; the shortest piece, at the bottom, ends at the first base." }; } })).concat([
      { q: "A Sanger trace shows two colors at the same position. This suggests…", ok: "A heterozygote: two alleles", no: ["A sequencing error only", "A deletion", "Contamination always"], why: "Mixed colors." },
      { q: "Next-generation sequencing differs from Sanger because it…", ok: "Reads millions of short fragments in parallel and aligns them to a reference", no: ["Reads one long fragment", "Uses a gel", "Does not need DNA"], why: "The cost of a genome has dropped enormously." }]) },
  { type: "classify", title: "Predict one dose in three people", solved: "Same dose, three outcomes: no relief, relief, or overdose, set by how many working copies of one liver enzyme.", tip: "The liver enzyme CYP2D6 converts codeine to morphine.",
    voice: ["Three people, one dose: nonfunctional allele, normal, ultra-metabolizer. Warfarin is another case."],
    bins: ["Poor metabolizer (nonfunctional alleles)", "Normal metabolizer", "Ultra-rapid metabolizer (extra active copies)"],
    items: [["Little morphine made; codeine gives no pain relief", 0], ["Expected pain relief at the standard dose", 1], ["Too much morphine made; risk of overdose", 2], ["Carries two nonfunctional CYP2D6 alleles", 0], ["Carries extra functional copies of CYP2D6", 2], ["Carries one working copy and one weak copy of average activity", 1]] },
  { type: "pick", title: "Comparing genomes and the vertical-inheritance trap", solved: "A variant that travels with ancestry will 'predict' anything else that does.", tip: "GWAS finds associations, not causes.",
    voice: ["Red hair and being English; yerba mate; chopsticks; football-club allegiance: a variant that rides with ancestry will 'predict' anything that does too. Hits nudge, they do not prove.", "Conserved non-coding elements; FOXP2; fast lineage-specific change."],
    qs: [
      { q: "A SNP strongly associates with preferring chopsticks. Why is that likely not causal?", ok: "It tracks ancestry, which also tracks culture", no: ["Chopsticks change DNA", "SNPs cannot be associated", "The p value was too high"], why: "Population structure confounds." },
      { q: "A region is nearly identical in macaque, mouse and zebrafish. This suggests…", ok: "Strong conservation: it probably matters", no: ["It is junk", "It was copied recently", "It is a transposon"], why: "Includes conserved non-coding elements." },
      { q: "Humans compared with each other are…", ok: "Very similar genetically", no: ["Highly diverse", "As diverse as chimps", "Identical"], why: "Unlike Tasmanian devils, which are even less diverse." },
      { q: "Why raise the significance threshold in a GWAS?", ok: "Millions of tests make some small p values by chance", no: ["To lower the cost", "To find more hits", "Because the p value is wrong"], why: "Multiple comparisons." }] },
  { type: "drill", title: "Cards", voice: ["Type each term. Two right in a row masters a card."],
    bank: ["dideoxynucleotide", "chain terminator", "Sanger sequencing", "next-generation sequencing", "SNP", "GWAS", "Manhattan plot", "polygenic", "pharmacogenomics", "CYP2D6", "warfarin", "conserved", "FOXP2", "reference genome"],
    cards: [
      { make: () => { const s = rseq(); return { q: "Type the sequence the gel shows, shortest to longest.", a: s, draw: sanger(s), w: 380, h: 180 }; } },
      { make: () => { const s = rseq(); return { q: "Type the sequence the gel shows, shortest to longest.", a: s, draw: sanger(s), w: 380, h: 180 }; } },
      C("The modified nucleotide that stops a growing strand in Sanger sequencing.", ["dideoxynucleotide", "ddntp", "chain terminator", "dideoxynucleotides"]),
      C("Sequencing that reads millions of fragments at once is called…", ["next-generation sequencing", "next generation sequencing", "ngs", "massively parallel"]),
      C("A single-base difference between people.", ["snp", "a snp", "single nucleotide polymorphism"]),
      C("A scan of the genome for variants associated with a trait.", ["gwas", "genome-wide association study", "genome wide association study"]),
      C("The plot of −log p for every variant across the genome.", ["manhattan plot", "a manhattan plot"]),
      C("A trait influenced by many genes.", ["polygenic"]), C("How genes affect drug response.", ["pharmacogenomics"]),
      C("The liver enzyme that turns codeine into morphine.", ["cyp2d6"]), C("The blood thinner whose dose depends on genotype.", ["warfarin"]),
      C("A sequence kept nearly identical across species is…", ["conserved", "highly conserved"]),
      C("The gene linked to speech and language.", ["foxp2"]),
      C("Short reads are aligned to a…", ["reference genome", "reference"]),
      C("A statistical correction for testing millions of variants.", ["multiple comparison", "multiple comparisons", "bonferroni", "bonferroni correction", "multiple testing"])] }
] });

</script>
</body>
</html>
